name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Fail on a uv.lock out of date with pyproject.toml instead of relocking.
  UV_LOCKED: 1
  # Print why each skipped test was skipped.
  PYTEST_ADDOPTS: -rs
  # The Python of the Dockerfile.
  UV_PYTHON: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Integration tests start RabbitMQ through Docker, available on the runner.
      - run: make test-all
